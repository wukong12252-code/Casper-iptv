
name: Build Casper IPTV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          find "$ANDROID_HOME" -name sdkmanager -type f || true
          ls -la "$ANDROID_HOME/cmdline-tools" || true

      - name: Install Android packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Unpack project
        run: |
          mkdir -p project
          unzip -q Casper-IPTV-v0.3.5-source.zip -d project
          find project -maxdepth 4 -name build.gradle

      - name: Build APK
        working-directory: project/CasperIPTV
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          ./gradle-8.9/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Casper-IPTV-v0.3.5-APK
          path: project/CasperIPTV/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
